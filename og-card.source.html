<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:#16191d;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 88px;
    position:relative;
  }
  .bar{position:absolute;left:0;top:0;bottom:0;width:14px;
       background:linear-gradient(180deg,#0f766e,#1e3a8a)}
  .top{display:flex;align-items:center;gap:30px;margin-bottom:38px}
  .mono{
    width:104px;height:104px;border-radius:50%;flex:none;
    background:linear-gradient(145deg,#0f766e,#1a5570);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Iowan Old Style",serif;font-weight:700;font-size:42px;letter-spacing:.02em;
  }
  h1{font-family:Georgia,"Iowan Old Style",serif;font-size:74px;line-height:1;
     letter-spacing:-.02em;font-weight:700}
  .suffix{font-size:36px;color:#6b7280;font-weight:400;letter-spacing:0}
  .roles{font-size:25px;line-height:1.45;color:#3f4650;margin-bottom:34px;max-width:1000px}
  .roles b{font-weight:600;color:#16191d}
  .rule{height:1px;background:#e3e6ea;margin-bottom:30px;max-width:1000px}
  .tags{display:flex;gap:12px;flex-wrap:wrap}
  .tag{font-size:21px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
       color:#0f766e;background:#e6f4f1;border-radius:999px;padding:9px 20px}
  .tag.nocaps{text-transform:none;letter-spacing:.02em}
  .url{position:absolute;right:88px;bottom:52px;font-size:21px;color:#6b7280}
</style></head>
<body>
  <div class="bar"></div>
  <div class="top">
    <div class="mono">MK</div>
    <h1>Michal Kouril<span class="suffix">, PhD</span></h1>
  </div>
  <p class="roles">
    <b>Research Associate Professor of Pediatrics</b> — University of Cincinnati College of Medicine<br>
    Division of Biomedical Informatics — Cincinnati Children's Hospital Medical Center
  </p>
  <div class="rule"></div>
  <div class="tags">
    <span class="tag">RDCRN</span>
    <span class="tag">B2B CHANGE</span>
    <span class="tag">LungMAP</span>
    <span class="tag nocaps">iLINCS</span>
  </div>
  <div class="url">michalkouril.com</div>
</body></html>
